name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Static binary: runs on any x86_64 Linux regardless of its glibc version.
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt --target "$TARGET"
          rustup toolchain install 1.85 --profile minimal
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Minimum supported Rust (Debian 13's rustc)
        run: cargo +1.85 check --locked

      - name: Build static release binary
        run: cargo build --locked --release --target "$TARGET"

      - name: Package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "$GITHUB_REF_TYPE" = tag ] || version="${version}~dev${GITHUB_RUN_NUMBER}"
          mkdir dist
          cp "target/$TARGET/release/ov02c10-camera" dist/ov02c10-camera-x86_64-linux
          scripts/build-deb.sh dist/ov02c10-camera-x86_64-linux "$version" dist
          (cd dist && sha256sum ./* > SHA256SUMS)
          dpkg-deb --info dist/ov02c10-camera_amd64.deb
          dpkg-deb --contents dist/ov02c10-camera_amd64.deb

      # There is no camera here, so this only proves the package installs and
      # the binary starts, is static, and fails cleanly without the hardware.
      - name: Smoke test the package
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ./dist/ov02c10-camera_amd64.deb
          systemctl --global is-enabled ov02c10-camera.service
          ov02c10-camera --version
          ov02c10-camera --help
          ldd /usr/bin/ov02c10-camera 2>&1 | grep -Eq 'statically linked|not a dynamic executable'
          if ov02c10-camera --loopback; then
            echo "expected a failure without /dev/video48" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ov02c10-camera
          path: dist/
          if-no-files-found: error

  # dev      -> rolling "dev-latest" pre-release, for testing on real hardware
  # v* tags  -> a normal release
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ov02c10-camera
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release delete dev-latest --cleanup-tag --yes 2>/dev/null || true
            gh release create dev-latest dist/* --prerelease --target "$GITHUB_SHA" \
              --title "Development build" \
              --notes "Latest build of the dev branch (${GITHUB_SHA::7}). Not hardware-tested; replaced on every push to dev."
          fi
