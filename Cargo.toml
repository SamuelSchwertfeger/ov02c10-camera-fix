[package]
name = "ov02c10-camera"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Userspace capture + debayer + v4l2loopback bridge for the OV02C10 sensor behind Intel IPU6"
license = "MIT"
repository = "https://github.com/sethbarrett50/ov02c10-camera-fix"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
